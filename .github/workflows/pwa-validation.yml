name: Validate PWA and fullscreen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARENA_TEST_URL: http://127.0.0.1:4173
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production PWA
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check offline resources, cache updates and fullscreen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pwa-smoke
          node scripts/serve.mjs > "$RUNNER_TEMP/arena-pwa-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/arena-pwa-server.log"
              exit 1
            fi
            if curl --fail --silent "$ARENA_TEST_URL/" > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "$RUNNER_TEMP/arena-pwa-server.log"
            exit 1
          fi
          node scripts/pwa-smoke.mjs

      - name: Upload PWA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/pwa-smoke/
            ${{ runner.temp }}/arena-pwa-server.log
          if-no-files-found: warn
          retention-days: 7
